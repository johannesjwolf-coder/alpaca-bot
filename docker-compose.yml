# Start: docker compose up -d --build   →   http://127.0.0.1:8000
services:
  alpaca-bot:
    build: .
    ports:
      - "127.0.0.1:8000:8000" # nur localhost des Hosts, nicht öffentlich
    env_file:
      - path: .env # optional, nicht versioniert (siehe .env.example)
        required: false
    environment:
      ALPACA_AUTH_MODE: ${ALPACA_AUTH_MODE:-env}
    volumes:
      - alpaca-bot-data:/data # SQLite-Datenbank bleibt über Neustarts erhalten
    restart: unless-stopped # Automatik und Orderfreigabe sind nach Neustart trotzdem aus

volumes:
  alpaca-bot-data:
